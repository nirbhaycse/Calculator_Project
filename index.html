<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12708a">
  <meta name="description" content="A simple responsive calculator built with HTML, CSS, and JavaScript.">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="calculator" aria-label="Calculator">
      <form id="calculator-form">
        <label class="sr-only" for="display">Calculator display</label>
        <input id="display" class="display" type="text" inputmode="decimal"
          autocomplete="off" aria-live="polite" aria-label="Calculator display" readonly>
        <div class="keypad">
          <button type="button" class="operator" data-action="clear">AC</button>
          <button type="button" class="operator" data-action="delete" aria-label="Delete last character">DE</button>
          <button type="button" class="operator" data-value=".">.</button>
          <button type="button" class="operator" data-value="/">÷</button>

          <button type="button" data-value="7">7</button>
          <button type="button" data-value="8">8</button>
          <button type="button" data-value="9">9</button>
          <button type="button" class="operator" data-value="*">×</button>

          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
          <button type="button" data-value="6">6</button>
          <button type="button" class="operator" data-value="-">−</button>

          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" class="operator" data-value="+">+</button>

          <button type="button" data-value="00">00</button>
          <button type="button" data-value="0">0</button>
          <button type="button" class="operator equal" data-action="calculate">=</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
